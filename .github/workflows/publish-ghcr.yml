name: Publish GHCR image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Extra image tag to publish"
        required: false
        default: "v31-index-snapshot"
  push:
    branches:
      - v31
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/useforesight/typesense

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: blacksmith-8vcpu-ubuntu-2204
            bazelisk_sha256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
          - arch: arm64
            platform: linux/arm64
            runner: blacksmith-8vcpu-ubuntu-2204-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        if: matrix.arch == 'amd64'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-10 make git zlib1g-dev m4 lld

          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 30
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 30

          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc 30
          sudo update-alternatives --set cc /usr/bin/gcc

          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++ 30
          sudo update-alternatives --set c++ /usr/bin/g++

      - name: Install Bazelisk
        if: matrix.arch == 'amd64'
        env:
          BAZELISK_ARCH: ${{ matrix.arch }}
          BAZELISK_SHA256: ${{ matrix.bazelisk_sha256 }}
          BAZELISK_VERSION: v1.29.0
        run: |
          curl -fsSL \
            "https://github.com/bazelbuild/bazelisk/releases/download/${BAZELISK_VERSION}/bazelisk-linux-${BAZELISK_ARCH}" \
            -o bazelisk
          echo "${BAZELISK_SHA256}  bazelisk" | sha256sum --check
          sudo install -m 0755 bazelisk /usr/local/bin/bazel

      - name: Set up Bazel
        if: matrix.arch == 'amd64'
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ vars.BAZEL_CACHE_KEY != '' && vars.BAZEL_CACHE_KEY || github.workflow }}
          repository-cache: true
          external-cache: true

      - name: Build protobuf deps
        if: matrix.arch == 'amd64'
        run: |
          bazel build @com_google_protobuf//:protobuf_headers
          bazel build @com_google_protobuf//:protobuf_lite
          bazel build @com_google_protobuf//:protobuf
          bazel build @com_google_protobuf//:protoc

      - name: Build Typesense server
        if: matrix.arch == 'amd64'
        run: bazel build //:typesense-server

      - name: Install ARM64 CMake
        if: matrix.arch == 'arm64'
        run: |
          archive="${RUNNER_TEMP}/cmake-arm64.tar.gz"
          install_dir="${RUNNER_TEMP}/cmake-arm64"
          curl --fail --location --silent --show-error \
            https://github.com/Kitware/CMake/releases/download/v3.24.4/cmake-3.24.4-linux-aarch64.tar.gz \
            --output "${archive}"
          echo "86f823f2636bf715af89da10e04daa476755a799d451baee66247846e95d7bee  ${archive}" |
            sha256sum --check
          mkdir "${install_dir}"
          tar --extract --gzip --file "${archive}" \
            --directory "${install_dir}" --strip-components=1
          echo "ARM_CMAKE_DIR=${install_dir}" >> "${GITHUB_ENV}"

      - name: Build Typesense server for ARM64
        if: matrix.arch == 'arm64'
        run: |
          image="typesense/typesense-development-arm:27-JUN-2022-1@sha256:0b23f09746a8a49d9660ff8603823ac3fee671ea325b502f6de75a9a3d947467"
          docker run --rm --platform linux/arm64 \
            --volume "${PWD}:/typesense" \
            --volume "${ARM_CMAKE_DIR}:/opt/cmake:ro" \
            "${image}" \
            /opt/cmake/bin/cmake -DTYPESENSE_VERSION=nightly -DCMAKE_BUILD_TYPE=Release \
            -H/typesense -B/typesense/build-Linux
          docker run --rm --platform linux/arm64 \
            --volume "${PWD}:/typesense" \
            --volume "${ARM_CMAKE_DIR}:/opt/cmake:ro" \
            "${image}" \
            make -j8 typesense-server -C/typesense/build-Linux

      - name: Prepare image context
        run: |
          mkdir image
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            cp build-Linux/typesense-server image/typesense-server
          else
            cp bazel-bin/typesense-server image/typesense-server
          fi
          cp docker/deployment.Dockerfile image/Dockerfile

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@v1
        with:
          max-cache-size-mb: "10240"

      - name: Build and push image
        uses: useblacksmith/build-push-action@v2
        with:
          context: image
          file: image/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/useforesight/typesense
            org.opencontainers.image.description=Typesense with index snapshot cache support
            org.opencontainers.image.licenses=GPL-3.0
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}

      - name: Smoke test built-in embeddings
        shell: bash
        run: |
          image="${IMAGE_NAME}:${GITHUB_SHA}-${{ matrix.arch }}"
          docker pull "${image}"
          docker run --detach --name typesense-embedding-smoke \
            --publish 127.0.0.1:8108:8108 \
            --mount type=volume,destination=/data \
            "${image}" \
            --data-dir=/data \
            --api-key=smoke-key
          trap 'docker rm --force --volumes typesense-embedding-smoke' EXIT

          until curl --fail --silent http://127.0.0.1:8108/health; do
            sleep 1
          done
          curl --fail-with-body --max-time 180 \
            --request POST http://127.0.0.1:8108/collections \
            --header 'Content-Type: application/json' \
            --header 'X-TYPESENSE-API-KEY: smoke-key' \
            --data '{"name":"embedding_smoke","fields":[{"name":"text","type":"string"},{"name":"embedding","type":"float[]","embed":{"from":["text"],"model_config":{"model_name":"ts/e5-small"}}}]}'

  publish:
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2204

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          tags="${IMAGE_NAME}:${GITHUB_SHA}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_IMAGE_TAG}" ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:${INPUT_IMAGE_TAG}"
          elif [[ "${GITHUB_REF_NAME}" == "v31" ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:v31-index-snapshot"
          fi

          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish multi-architecture manifests
        shell: bash
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker buildx imagetools create \
              --tag "${tag}" \
              "${IMAGE_NAME}:${GITHUB_SHA}-amd64" \
              "${IMAGE_NAME}:${GITHUB_SHA}-arm64"
          done <<< "${TAGS}"

      - name: Verify published architectures
        shell: bash
        run: |
          docker buildx imagetools inspect \
            --raw "${IMAGE_NAME}:${GITHUB_SHA}" |
            jq -e '
              [.manifests[].platform |
                select(.os == "linux") |
                .architecture] |
              (index("amd64") != null and index("arm64") != null)
            '
