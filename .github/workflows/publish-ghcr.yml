name: Publish GHCR image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Extra image tag to publish"
        required: false
        default: "v31-index-snapshot"
  push:
    branches:
      - v31
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/useforesight/typesense

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: blacksmith-8vcpu-ubuntu-2204
            bazelisk_sha256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
          - arch: arm64
            platform: linux/arm64
            runner: blacksmith-8vcpu-ubuntu-2204-arm
            bazelisk_sha256: e20e8b0f4f240091b7a55bf17b9398bd4f40ee70ae0208dff95dd4c445fb4010

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@v1
        with:
          max-cache-size-mb: "10240"

      - name: Build and push image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: docker/ghcr.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BAZELISK_SHA256=${{ matrix.bazelisk_sha256 }}
          labels: |
            org.opencontainers.image.source=https://github.com/useforesight/typesense
            org.opencontainers.image.description=Typesense with index snapshot cache support
            org.opencontainers.image.licenses=GPL-3.0
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}

      - name: Smoke test built-in embeddings
        shell: bash
        run: |
          image="${IMAGE_NAME}:${GITHUB_SHA}-${{ matrix.arch }}"
          docker pull "${image}"
          docker run --detach --name typesense-embedding-smoke \
            --publish 127.0.0.1:8108:8108 \
            --mount type=volume,destination=/data \
            "${image}" \
            --data-dir=/data \
            --api-key=smoke-key
          trap 'docker rm --force --volumes typesense-embedding-smoke' EXIT

          until curl --fail --silent http://127.0.0.1:8108/health; do
            sleep 1
          done
          curl --fail-with-body --max-time 180 \
            --request POST http://127.0.0.1:8108/collections \
            --header 'Content-Type: application/json' \
            --header 'X-TYPESENSE-API-KEY: smoke-key' \
            --data '{"name":"embedding_smoke","fields":[{"name":"text","type":"string"},{"name":"embedding","type":"float[]","embed":{"from":["text"],"model_config":{"model_name":"ts/e5-small"}}}]}'

  publish:
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2204

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          tags="${IMAGE_NAME}:${GITHUB_SHA}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_IMAGE_TAG}" ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:${INPUT_IMAGE_TAG}"
          elif [[ "${GITHUB_REF_NAME}" == "v31" ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:v31-index-snapshot"
          fi

          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish multi-architecture manifests
        shell: bash
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker buildx imagetools create \
              --tag "${tag}" \
              "${IMAGE_NAME}:${GITHUB_SHA}-amd64" \
              "${IMAGE_NAME}:${GITHUB_SHA}-arm64"
          done <<< "${TAGS}"

      - name: Verify published architectures
        shell: bash
        run: |
          docker buildx imagetools inspect \
            --raw "${IMAGE_NAME}:${GITHUB_SHA}" |
            jq -e '
              [.manifests[].platform |
                select(.os == "linux") |
                .architecture] |
              (index("amd64") != null and index("arm64") != null)
            '
