name: Publish GHCR image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Extra image tag to publish"
        required: false
        default: "v31-index-snapshot"
  push:
    branches:
      - v31
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/useforesight/typesense

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: blacksmith-8vcpu-ubuntu-2204
            bazelisk_sha256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
          - arch: arm64
            platform: linux/arm64
            runner: blacksmith-8vcpu-ubuntu-2204-arm
            bazelisk_sha256: e20e8b0f4f240091b7a55bf17b9398bd4f40ee70ae0208dff95dd4c445fb4010

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-10 make git zlib1g-dev m4 lld

          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 30
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 30

          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc 30
          sudo update-alternatives --set cc /usr/bin/gcc

          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++ 30
          sudo update-alternatives --set c++ /usr/bin/g++

      - name: Install Bazelisk
        env:
          BAZELISK_ARCH: ${{ matrix.arch }}
          BAZELISK_SHA256: ${{ matrix.bazelisk_sha256 }}
          BAZELISK_VERSION: v1.29.0
        run: |
          curl -fsSL \
            "https://github.com/bazelbuild/bazelisk/releases/download/${BAZELISK_VERSION}/bazelisk-linux-${BAZELISK_ARCH}" \
            -o bazelisk
          echo "${BAZELISK_SHA256}  bazelisk" | sha256sum --check
          sudo install -m 0755 bazelisk /usr/local/bin/bazel

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ vars.BAZEL_CACHE_KEY != '' && vars.BAZEL_CACHE_KEY || github.workflow }}
          repository-cache: true
          external-cache: true

      - name: Build protobuf deps
        run: |
          bazel build @com_google_protobuf//:protobuf_headers
          bazel build @com_google_protobuf//:protobuf_lite
          bazel build @com_google_protobuf//:protobuf
          bazel build @com_google_protobuf//:protoc

      - name: Build Typesense server
        run: bazel build //:typesense-server

      - name: Prepare image context
        run: |
          mkdir image
          cp bazel-bin/typesense-server image/typesense-server
          cp docker/deployment.Dockerfile image/Dockerfile

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@v1
        with:
          max-cache-size-mb: "10240"

      - name: Build and push image
        uses: useblacksmith/build-push-action@v2
        with:
          context: image
          file: image/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/useforesight/typesense
            org.opencontainers.image.description=Typesense with index snapshot cache support
            org.opencontainers.image.licenses=GPL-3.0
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}

  publish:
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2204

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          tags="${IMAGE_NAME}:${GITHUB_SHA}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_IMAGE_TAG}" ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:${INPUT_IMAGE_TAG}"
          elif [[ "${GITHUB_REF_NAME}" == "v31" ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:v31-index-snapshot"
          fi

          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish multi-architecture manifests
        shell: bash
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker buildx imagetools create \
              --tag "${tag}" \
              "${IMAGE_NAME}:${GITHUB_SHA}-amd64" \
              "${IMAGE_NAME}:${GITHUB_SHA}-arm64"
          done <<< "${TAGS}"

      - name: Verify published architectures
        shell: bash
        run: |
          docker buildx imagetools inspect \
            --raw "${IMAGE_NAME}:${GITHUB_SHA}" |
            jq -e '
              [.manifests[].platform |
                select(.os == "linux") |
                .architecture] |
              (index("amd64") != null and index("arm64") != null)
            '
