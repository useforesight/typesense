name: Sparsepp concurrent initialization

on:
  pull_request:
    paths:
      - include/sparsepp.h
      - test/sanitizers/**
      - .github/workflows/sparsepp-startup.yml

permissions:
  contents: read

jobs:
  thread-sanitizer:
    runs-on: blacksmith-8vcpu-ubuntu-2204-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check concurrent first use with ThreadSanitizer
        run: |
          g++ -std=c++17 -g -O1 -fsanitize=thread -pthread -I include \
            test/sanitizers/sparsepp_startup.cpp -o "$RUNNER_TEMP/sparsepp-startup"
          for attempt in {1..100}; do
            TSAN_OPTIONS=halt_on_error=1 "$RUNNER_TEMP/sparsepp-startup"
          done
